<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logo Pulse Mesh / SVG CSS VJ Site</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020203;
        --ink: #f6fbfb;
        --muted: #98a8aa;
        --cyan: #35efff;
        --rose: #ff4f9f;
        --gold: #ffd447;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      svg {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #020203;
      }

      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.76);
      }

      h1 {
        margin: 0;
        font-size: clamp(21px, 4.2vw, 52px);
        line-height: 0.96;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: clamp(12px, 1.4vw, 15px);
        line-height: 1.55;
      }

      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(246, 251, 251, 0.28);
        background: rgba(2, 2, 3, 0.44);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }

      .orbit {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbit 20s linear infinite;
      }

      .orbit.reverse {
        animation-direction: reverse;
      }

      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 5s ease-in-out infinite;
      }

      .scan {
        animation: scan 20s linear infinite;
      }

      .dash {
        stroke-dasharray: 24 34;
        animation: dash 20s linear infinite;
      }

      .word {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 800;
        letter-spacing: 0;
        fill: rgba(246, 251, 251, 0.74);
        animation: word-fade 4s ease-in-out infinite;
      }

      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(246, 251, 251, 0.13);
      }

      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, var(--cyan), var(--rose), var(--gold));
        animation: loop-meter 20s linear infinite;
      }

      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.42; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes scan {
        from { transform: translateY(-58%); }
        to { transform: translateY(58%); }
      }

      @keyframes dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -1160; }
      }

      @keyframes word-fade {
        0%, 100% { opacity: 0.28; }
        50% { opacity: 0.95; }
      }

      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }

      @media (max-width: 680px) {
        .hud {
          display: block;
        }

        a {
          display: inline-block;
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="-960 -540 1920 1080" role="img" aria-label="Logo Pulse Mesh looping SVG visual">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="62%">
          <stop offset="0%" stop-color="#35efff" stop-opacity="0.34"/>
          <stop offset="38%" stop-color="#ff4f9f" stop-opacity="0.13"/>
          <stop offset="72%" stop-color="#ffd447" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#020203" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
        <filter id="hot" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <rect x="-960" y="-540" width="1920" height="1080" fill="#020203"/>
      <circle r="680" fill="url(#glow)" class="pulse"/>

      <g opacity="0.78" filter="url(#hot)">
        <g class="orbit">
          <ellipse rx="720" ry="250" fill="none" stroke="#35efff" stroke-width="3" class="dash"/>
          <ellipse rx="530" ry="182" fill="none" stroke="#ff4f9f" stroke-width="3" class="dash"/>
          <ellipse rx="340" ry="118" fill="none" stroke="#ffd447" stroke-width="2" class="dash"/>
        </g>
        <g class="orbit reverse">
          <ellipse rx="760" ry="264" fill="none" stroke="#f6fbfb" stroke-opacity="0.2" stroke-width="2" transform="rotate(22)" class="dash"/>
          <ellipse rx="470" ry="162" fill="none" stroke="#35efff" stroke-opacity="0.36" stroke-width="2" transform="rotate(-16)" class="dash"/>
        </g>
      </g>

      <g class="orbit" opacity="0.84">
        <polygon points="0,-250 236,-77 146,202 -146,202 -236,-77" fill="none" stroke="#35efff" stroke-width="4" filter="url(#hot)"/>
        <polygon points="0,-170 162,-52 100,138 -100,138 -162,-52" fill="none" stroke="#ff4f9f" stroke-width="4" filter="url(#hot)"/>
        <line x1="-720" y1="0" x2="720" y2="0" stroke="#f6fbfb" stroke-opacity="0.13" stroke-width="2"/>
        <line x1="0" y1="-360" x2="0" y2="360" stroke="#f6fbfb" stroke-opacity="0.13" stroke-width="2"/>
      </g>

      <g opacity="0.46">
        <g class="orbit reverse">
          <circle cx="0" cy="-310" r="14" fill="#ffd447" filter="url(#hot)"/>
          <circle cx="268" cy="-154" r="10" fill="#35efff" filter="url(#hot)"/>
          <circle cx="268" cy="154" r="18" fill="#ff4f9f" filter="url(#hot)"/>
          <circle cx="0" cy="310" r="12" fill="#35efff" filter="url(#hot)"/>
          <circle cx="-268" cy="154" r="15" fill="#ffd447" filter="url(#hot)"/>
          <circle cx="-268" cy="-154" r="10" fill="#ff4f9f" filter="url(#hot)"/>
        </g>
      </g>

      <g text-anchor="middle" dominant-baseline="middle">
        <text class="word" x="0" y="-12" font-size="96">LOGO</text>
        <text class="word" x="0" y="76" font-size="48" style="animation-delay: -1.2s">PULSE MESH</text>
      </g>

      <g opacity="0.32">
        <text class="word" x="-650" y="-240" font-size="34" style="animation-delay: -0.5s">VECTOR</text>
        <text class="word" x="610" y="-190" font-size="34" style="animation-delay: -1.7s">DAILY</text>
        <text class="word" x="-560" y="250" font-size="34" style="animation-delay: -2.1s">LOOP</text>
        <text class="word" x="590" y="250" font-size="34" style="animation-delay: -3s">VJ</text>
      </g>

      <g class="scan" filter="url(#soft)">
        <rect x="-960" y="-54" width="1920" height="108" fill="#35efff" opacity="0.08"/>
        <line x1="-960" y1="0" x2="960" y2="0" stroke="#f6fbfb" stroke-opacity="0.42" stroke-width="2"/>
      </g>

      <g opacity="0.12">
        <path d="M -900 -360 H 900 M -900 -270 H 900 M -900 -180 H 900 M -900 -90 H 900 M -900 0 H 900 M -900 90 H 900 M -900 180 H 900 M -900 270 H 900 M -900 360 H 900" stroke="#f6fbfb" stroke-width="1"/>
      </g>
    </svg>
    <div class="hud">
      <div>
        <h1>Logo Pulse Mesh</h1>
        <p>SVG/CSS standalone sample / 2026-08-06 / locked 20 second loop</p>
      </div>
      <a href="../days/2026-08-06.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
  </body>
</html>
